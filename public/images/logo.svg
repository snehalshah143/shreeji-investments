<svg width="40" height="40" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="20" cy="20" r="18" fill="url(#logoGradient)" stroke="#92400e" stroke-width="2"/>
  
  <!-- S Letter -->
  <text x="20" y="28" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="white">S</text>
  
  <!-- Decorative Elements -->
  <circle cx="12" cy="12" r="2" fill="white" opacity="0.3"/>
  <circle cx="28" cy="28" r="2" fill="white" opacity="0.3"/>
  <circle cx="28" cy="12" r="1.5" fill="white" opacity="0.2"/>
  <circle cx="12" cy="28" r="1.5" fill="white" opacity="0.2"/>
</svg>
