<svg width="40" height="40" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a8a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background with rounded corners -->
  <rect x="2" y="2" width="36" height="36" rx="8" ry="8" fill="url(#logoGradient)" stroke="#1e40af" stroke-width="1"/>
  
  <!-- Shreeji Text -->
  <text x="20" y="16" font-family="Arial, sans-serif" font-size="8" font-weight="bold" text-anchor="middle" fill="url(#goldGradient)">SHREEJI</text>
  
  <!-- Investment symbol -->
  <circle cx="20" cy="26" r="6" fill="url(#goldGradient)" opacity="0.9"/>
  <text x="20" y="30" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="white">₹</text>
  
  <!-- Decorative dots -->
  <circle cx="8" cy="8" r="1" fill="url(#goldGradient)" opacity="0.6"/>
  <circle cx="32" cy="32" r="1" fill="url(#goldGradient)" opacity="0.6"/>
</svg>
